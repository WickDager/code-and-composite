<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WCAG AA/AAA contrast checker — test foreground and background colour pairs for accessibility compliance.">
  <meta name="theme-color" content="#534AB7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formspree.io; frame-ancestors 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta property="og:title" content="Contrast Checker — Code &amp; Composite">
  <meta property="og:description" content="Test colour pairs against WCAG AA and AAA standards. Get compliance suggestions.">
  <meta property="og:image" content="/public/images/og/og-contrast-checker.jpg">
  <meta property="og:type" content="website">
  <title>Contrast Checker — Code &amp; Composite</title>
  <link rel="icon" href="/public/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/animations.css">
  <link rel="stylesheet" href="/src/css/dark-mode.css">
  <script src="/src/js/main.js" defer></script>
  <script src="/src/js/projects/contrast-checker.js" defer></script>
  <style>
    .checker { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xl); align-items: start; }
    .checker__controls { background: var(--color-bg); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--radius-lg); padding: var(--space-lg); }
    .checker__preview { background: var(--color-bg); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--radius-lg); padding: var(--space-xl); text-align: center; }
    .color-input-group { margin-bottom: var(--space-md); }
    .color-input-group label { display: block; font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--color-text-secondary); margin-bottom: var(--space-2xs); }
    .color-input-row { display: flex; align-items: center; gap: var(--space-sm); }
    .color-input-row input[type="color"] { width: 40px; height: 40px; border: none; border-radius: var(--radius-md); cursor: pointer; padding: 0; background: none; }
    .color-input-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    .color-input-row input[type="color"]::-webkit-color-swatch { border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .color-input-row input[type="text"] { flex: 1; font-family: var(--font-mono); font-size: var(--fs-sm); padding: 8px var(--space-sm); background: var(--color-bg-secondary); border: 0.5px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); }
    .color-input-row input[type="text"]:focus { outline: none; border-color: var(--color-accent); box-shadow: var(--shadow-focus); }
    .preview-box { border-radius: var(--radius-lg); padding: var(--space-xl); margin-bottom: var(--space-md); min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background-color var(--transition-slow), color var(--transition-slow); }
    .preview-box__title { font-size: var(--fs-lg); font-weight: var(--fw-semibold); margin-bottom: var(--space-xs); }
    .preview-box__body { font-size: var(--fs-base); line-height: 1.6; }
    .preview-box__small { font-size: var(--fs-xs); margin-top: var(--space-xs); opacity: 0.8; }
    .results { display: flex; gap: var(--space-md); justify-content: center; flex-wrap: wrap; margin-top: var(--space-md); }
    .result-card { background: var(--color-bg-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); text-align: center; min-width: 140px; }
    .result-card__level { font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
    .result-card__badge { margin-top: var(--space-xs); }
    .ratio-display { font-size: var(--fs-2xl); font-weight: var(--fw-bold); color: var(--color-text-primary); margin: var(--space-sm) 0; font-family: var(--font-mono); }
    .suggestion { margin-top: var(--space-md); padding: var(--space-md); background: var(--color-bg-info); border-radius: var(--radius-md); font-size: var(--fs-xs); color: var(--color-text-info); }
    .suggestion code { font-size: var(--fs-xs); }
    @media (max-width: 768px) { .checker { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="nav-container"></div>
  <main id="main-content" class="page-main">
    <div class="container">
      <section class="fade-in" aria-label="Accessibility Contrast Checker">
        <header class="section-header">
          <p class="section-header__eyebrow">Project</p>
          <h2 class="section-header__title">Contrast Checker</h2>
          <p class="section-header__desc">Test foreground and background colour pairs against WCAG 2.1 AA and AAA standards.</p>
        </header>

        <div class="checker">
          <div class="checker__controls">
            <div class="color-input-group">
              <label for="cc-fg">Foreground (text) colour</label>
              <div class="color-input-row">
                <input type="color" id="cc-fg" value="#1a1a18">
                <input type="text" id="cc-fg-text" value="#1a1a18" maxlength="7" aria-label="Foreground colour hex value">
              </div>
            </div>
            <div class="color-input-group">
              <label for="cc-bg">Background colour</label>
              <div class="color-input-row">
                <input type="color" id="cc-bg" value="#ffffff">
                <input type="text" id="cc-bg-text" value="#ffffff" maxlength="7" aria-label="Background colour hex value">
              </div>
            </div>
          </div>

          <div class="checker__preview">
            <div class="preview-box" id="cc-preview">
              <p class="preview-box__title" id="cc-preview-title">Sample Heading Text</p>
              <p class="preview-box__body">This is how your text will look at the selected contrast ratio.</p>
              <p class="preview-box__small">Small text (14px / below 18px bold)</p>
            </div>

            <div class="ratio-display" id="cc-ratio" aria-live="polite">21.00:1</div>

            <div class="results" id="cc-results" aria-live="polite"></div>

            <div class="suggestion" id="cc-suggestion" style="display:none"></div>
          </div>
        </div>

        <div style="text-align:center;margin-top:var(--space-xl)">
          <a href="/work/" class="btn btn--ghost">← Back to all projects</a>
        </div>
      </section>
    </div>
  </main>
  <div id="footer-container"></div>
</body>
</html>
