<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Code &amp; Composite — Design Archive. Photo manipulation, brand identity, print &amp; editorial, UI design, data visualisation, and process teardowns.">
  <meta name="author" content="Code &amp; Composite">
  <meta name="theme-color" content="#534AB7">

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formspree.io; frame-ancestors 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

  <!-- Open Graph -->
  <meta property="og:title" content="Design Archive — Code &amp; Composite">
  <meta property="og:description" content="Photo manipulation, brand identity, print &amp; editorial, UI design, data visualisation, and process teardowns.">
  <meta property="og:image" content="/public/images/og/og-design.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://codeandcomposite.com/design/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Design Archive — Code &amp; Composite">
  <meta name="twitter:description" content="Design archive — photo manipulation, branding, UI, print, data viz.">
  <meta name="twitter:image" content="/public/images/og/og-design.jpg">

  <title>Design Archive — Code &amp; Composite</title>
  <link rel="icon" href="/public/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/public/site.webmanifest">

  <!-- Canonical -->
  <link rel="canonical" href="https://codeandcomposite.com/design/">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Critical CSS inlined -->
  <style>
    :root{--color-bg:#ffffff;--color-bg-secondary:#f7f6f3;--color-accent:#534ab7;--color-text-primary:#1a1a18;--color-text-secondary:#6b6a65;--color-text-tertiary:#9c9a92;--color-border:rgba(0,0,0,0.1);--color-border-tertiary:rgba(0,0,0,0.04);--nav-height:56px;--color-text-inverse:#ffffff;--color-accent-hover:#4439a0;--fs-xs:clamp(0.7rem,0.65rem + 0.25vw,0.8rem);--fs-sm:clamp(0.8rem,0.75rem + 0.25vw,0.9rem);--fs-base:clamp(0.9rem,0.85rem + 0.25vw,1rem);--fs-md:clamp(1rem,0.9rem + 0.5vw,1.25rem);--fs-lg:clamp(1.15rem,1rem + 0.75vw,1.5rem);--fs-xl:clamp(1.4rem,1.1rem + 1.5vw,2rem);--fs-2xl:clamp(1.75rem,1.3rem + 2.25vw,2.75rem);--fs-hero:clamp(2.5rem,1.5rem + 5vw,4.5rem);--font-sans:'Inter',system-ui,sans-serif;--lh-tight:1.1;--lh-snug:1.25;--lh-relaxed:1.75;--fw-medium:500;--fw-semibold:600;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;--space-2xs:4px;--space-xs:8px;--space-sm:12px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;--space-3xl:64px;--space-4xl:96px;--transition:150ms ease;--shadow-md:0 4px 12px rgba(0,0,0,0.08);--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--grain-opacity:0.03;--max-width:1200px}
    body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:var(--grain-opacity);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px 256px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.5;color:var(--color-text-primary);background:var(--color-bg);-webkit-font-smoothing:antialiased}
    .skip-link{position:absolute;top:-100%;left:var(--space-md);z-index:10000;background:var(--color-accent);color:var(--color-text-inverse);padding:var(--space-xs) var(--space-md);border-radius:var(--radius-sm);font-size:var(--fs-sm);font-weight:var(--fw-medium)}.skip-link:focus{top:var(--space-md)}
    .site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-height);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-lg);background:color-mix(in srgb, var(--color-bg) 85%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:0.5px solid var(--color-border-tertiary)}
    .site-nav__logo{display:flex;align-items:center;gap:var(--space-xs);font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-text-primary);text-decoration:none}.site-nav__logo:hover{color:var(--color-accent)}
    .site-nav__logo-icon{font-size:var(--fs-md);color:var(--color-accent)}
    .site-nav__amp{color:var(--color-accent);font-style:italic}
    .site-nav__links{display:flex;align-items:center;gap:var(--space-xs)}
    .site-nav__link{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--color-text-secondary);text-decoration:none;padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-sm);transition:color var(--transition),background var(--transition)}.site-nav__link:hover{color:var(--color-text-primary);background:var(--color-bg-secondary)}
    .site-nav__theme{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);color:var(--color-text-secondary);margin-left:var(--space-xs);cursor:pointer;background:none;border:none}.site-nav__theme:hover{color:var(--color-text-primary);background:var(--color-bg-secondary)}
    .icon--sun{display:none}.icon--moon{display:block}html.dark .icon--sun{display:block}html.dark .icon--moon{display:none}
    .container{max-width:var(--max-width);margin:0 auto;padding:0 var(--space-lg)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);font-family:var(--font-sans);font-size:var(--fs-sm);font-weight:var(--fw-medium);padding:10px 20px;border-radius:var(--radius-md);border:0.5px solid var(--color-border);cursor:pointer;text-decoration:none;transition:all var(--transition);line-height:1;white-space:nowrap}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}.btn:active{transform:translateY(0)}
    .btn--primary{background:var(--color-accent);color:var(--color-text-inverse);border-color:var(--color-accent)}.btn--primary:hover{background:var(--color-accent-hover);border-color:var(--color-accent-hover)}
    .btn--secondary{background:var(--color-bg);color:var(--color-text-primary);border-color:var(--color-border)}.btn--secondary:hover{background:var(--color-bg-secondary)}
    .fade-in{opacity:0;transform:translateY(16px);transition:opacity 300ms ease,transform 300ms ease}.fade-in.visible{opacity:1;transform:translateY(0)}
    section{padding:var(--space-3xl) 0}
    .section-header{margin-bottom:var(--space-xl)}.section-header__eyebrow{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:var(--space-xs)}.section-header__title{font-size:var(--fs-xl);font-weight:var(--fw-semibold);color:var(--color-text-primary);letter-spacing:-0.02em}

    /* Page header */
    .page-header{padding:calc(var(--nav-height) + var(--space-3xl)) 0 var(--space-2xl);text-align:center}
    .page-header__eyebrow{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:var(--space-xs)}
    .page-header__title{font-size:var(--fs-2xl);font-weight:var(--fw-semibold);letter-spacing:-0.03em;line-height:var(--lh-tight)}

    /* Filter tabs */
    .filter-tabs{display:flex;flex-wrap:wrap;gap:var(--space-xs);justify-content:center;margin-bottom:var(--space-xl);padding:0 var(--space-lg)}
    .filter-tab{font-size:var(--fs-xs);font-weight:var(--fw-medium);padding:var(--space-2xs) var(--space-sm);border-radius:var(--radius-full);border:0.5px solid var(--color-border);background:var(--color-bg);color:var(--color-text-secondary);cursor:pointer;transition:all var(--transition);font-family:var(--font-sans)}
    .filter-tab:hover{color:var(--color-text-primary);background:var(--color-bg-secondary)}
    .filter-tab[aria-pressed="true"]{background:var(--color-accent);color:var(--color-text-inverse);border-color:var(--color-accent)}

    /* Masonry gallery */
    .masonry{columns:3;column-gap:var(--space-md)}
    @media(max-width:900px){.masonry{columns:2}}
    @media(max-width:540px){.masonry{columns:1}}

    .masonry-card{break-inside:avoid;margin-bottom:var(--space-md);background:var(--color-bg);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-lg);overflow:hidden;transition:border-color var(--transition),transform var(--transition),box-shadow var(--transition)}
    .masonry-card:hover{border-color:var(--color-border);transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .masonry-card__img{width:100%;display:block;aspect-ratio:auto;background:var(--color-bg-secondary)}
    .masonry-card__body{padding:var(--space-md) var(--space-lg) var(--space-lg)}
    .masonry-card__tool{display:inline-block;font-size:10px;font-weight:var(--fw-medium);padding:2px 10px;border-radius:var(--radius-full);background:var(--color-bg-secondary);color:var(--color-text-tertiary);margin-bottom:var(--space-xs);text-transform:uppercase;letter-spacing:0.04em}
    .masonry-card__title{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-text-primary);line-height:var(--lh-snug);margin-bottom:var(--space-2xs)}
    .masonry-card__caption{font-size:var(--fs-xs);color:var(--color-text-secondary);line-height:1.5}

    /* Empty state */
    .empty-state{text-align:center;padding:var(--space-3xl) 0;color:var(--color-text-secondary)}
    .empty-state__icon{font-size:var(--fs-2xl);margin-bottom:var(--space-md);opacity:0.3}

    /* Footer */
    .site-footer{border-top:0.5px solid var(--color-border-tertiary);padding:var(--space-3xl) 0 var(--space-xl)}
    .site-footer__inner{display:grid;grid-template-columns:1fr 2fr;gap:var(--space-2xl)}
    .site-footer__brand{display:flex;flex-direction:column;gap:var(--space-xs)}
    .site-footer__logo{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-text-primary)}
    .site-footer__tagline{font-size:var(--fs-xs);color:var(--color-text-secondary)}
    .site-footer__links{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-lg)}
    .site-footer__col{display:flex;flex-direction:column;gap:var(--space-2xs)}
    .site-footer__heading{font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.06em}
    .site-footer__col a{font-size:var(--fs-xs);color:var(--color-text-secondary);text-decoration:none;transition:color var(--transition)}.site-footer__col a:hover{color:var(--color-text-primary)}
    .site-footer__bottom{margin-top:var(--space-xl);padding-top:var(--space-lg);border-top:0.5px solid var(--color-border-tertiary);text-align:center}
    .site-footer__copy{font-size:var(--fs-xs);color:var(--color-text-tertiary)}
    @media(max-width:768px){.site-nav__links{display:none}.site-nav__links.open{display:flex;position:fixed;top:var(--nav-height);left:0;right:0;bottom:0;background:var(--color-bg);flex-direction:column;align-items:center;justify-content:center;gap:var(--space-md);z-index:999}.site-nav__link{font-size:var(--fs-lg)}.site-footer__inner{grid-template-columns:1fr}.site-footer__links{grid-template-columns:1fr 1fr}}
    .fade-in{opacity:1!important;transform:none!important}
    @media(prefers-color-scheme:dark){:root{--color-bg:#111110;--color-bg-secondary:#1a1a18;--color-text-primary:#e8e6de;--color-text-secondary:#a3a198;--color-text-tertiary:#6b6a63;--color-border:rgba(255,255,255,0.1);--color-border-tertiary:rgba(255,255,255,0.04);--color-accent:#7f77dd;--color-accent-hover:#948de8;--color-text-inverse:#1a1a18}}
  </style>

  <!-- Non-critical CSS loaded async -->
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/dark-mode.css">
  <link rel="stylesheet" href="/src/css/animations.css" media="print" onload="this.media='all'">
  <link rel="noscript" href="/src/css/animations.css">
</head>
<body>
  <!-- Skip link -->
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Nav (injected by JS) -->
  <div id="nav-container"></div>

  <!-- Main content -->
  <main id="main-content">
    <div class="container">

      <!-- Page header -->
      <header class="page-header fade-in" aria-label="Design Archive header">
        <p class="page-header__eyebrow">Design</p>
        <h1 class="page-header__title">Design Archive</h1>
      </header>

      <!-- Filter tabs -->
      <nav class="filter-tabs fade-in" aria-label="Filter design work by category">
        <button class="filter-tab" aria-pressed="true" data-category="all">All</button>
        <button class="filter-tab" aria-pressed="false" data-category="photo-manipulation">Photo Manipulation</button>
        <button class="filter-tab" aria-pressed="false" data-category="brand-identity">Brand Identity</button>
        <button class="filter-tab" aria-pressed="false" data-category="print-editorial">Print &amp; Editorial</button>
        <button class="filter-tab" aria-pressed="false" data-category="ui-design">UI Design</button>
        <button class="filter-tab" aria-pressed="false" data-category="data-viz">Data Viz</button>
        <button class="filter-tab" aria-pressed="false" data-category="process-teardown">Process Teardowns</button>
      </nav>

      <!-- Masonry gallery -->
      <section class="fade-in" aria-label="Design archive gallery">
        <div class="masonry" id="design-gallery" role="list">
          <!-- Populated from /src/data/design-archive.json -->
        </div>
      </section>

    </div>
  </main>

  <!-- Footer (injected by JS) -->
  <div id="footer-container"></div>

  <!-- JavaScript -->
  <script src="/src/js/main.js" defer></script>
  <script>
    (function () {
      'use strict';

      function escapeHtml(str) {
        if (typeof str !== 'string') return str;
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      var activeCategory = 'all';
      var allItems = [];

      function renderGallery(items) {
        var gallery = document.getElementById('design-gallery');
        if (!gallery) return;

        if (items.length === 0) {
          gallery.innerHTML = '<div class="empty-state" role="status"><p class="empty-state__icon" aria-hidden="true">&#x2300;</p><p>No items found in this category.</p></div>';
          return;
        }

        gallery.innerHTML = items.map(function (item) {
          return (
            '<div class="masonry-card" role="listitem">' +
              '<img class="masonry-card__img" src="' + escapeHtml(item.src) + '" alt="' + escapeHtml(item.alt) + '" loading="lazy">' +
              '<div class="masonry-card__body">' +
                '<span class="masonry-card__tool">' + escapeHtml(item.tool) + '</span>' +
                '<h3 class="masonry-card__title">' + escapeHtml(item.title) + '</h3>' +
                '<p class="masonry-card__caption">' + escapeHtml(item.caption) + '</p>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }

      function filterByCategory(category) {
        activeCategory = category;
        var filtered = category === 'all' ? allItems : allItems.filter(function (item) { return item.category === category; });
        renderGallery(filtered);
      }

      // Filter tab click handlers
      document.querySelector('.filter-tabs').addEventListener('click', function (e) {
        var tab = e.target.closest('.filter-tab');
        if (!tab) return;

        // Update aria-pressed states
        document.querySelectorAll('.filter-tab').forEach(function (t) {
          t.setAttribute('aria-pressed', 'false');
        });
        tab.setAttribute('aria-pressed', 'true');

        filterByCategory(tab.getAttribute('data-category'));
      });

      // Load design archive
      fetch('/src/data/design-archive.json')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          allItems = data;
          renderGallery(allItems);
        })
        .catch(function (err) {
          console.warn('Failed to load design archive:', err);
          var gallery = document.getElementById('design-gallery');
          if (gallery) {
            gallery.innerHTML = '<div class="empty-state" role="alert"><p>Failed to load design archive. Please try again later.</p></div>';
          }
        });
    })();
  </script>
</body>
</html>
