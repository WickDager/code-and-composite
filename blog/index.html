<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Process Blog — Case studies, TIL posts, and technical thinking from Code &amp; Composite.">
  <meta name="author" content="Code &amp; Composite">
  <meta name="theme-color" content="#534AB7">

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formspree.io; frame-ancestors 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

  <!-- Open Graph -->
  <meta property="og:title" content="Process Blog — Code &amp; Composite">
  <meta property="og:description" content="Case studies, TIL posts, and technical thinking.">
  <meta property="og:image" content="/public/images/og/og-blog.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://codeandcomposite.com/blog/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Process Blog — Code &amp; Composite">
  <meta name="twitter:description" content="Case studies, TIL posts, and technical thinking.">
  <meta name="twitter:image" content="/public/images/og/og-blog.jpg">

  <title>Process Blog — Code &amp; Composite</title>
  <link rel="icon" href="/public/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/public/site.webmanifest">

  <!-- Canonical -->
  <link rel="canonical" href="https://codeandcomposite.com/blog/">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Critical CSS inlined -->
  <style>
    :root{--color-bg:#ffffff;--color-bg-secondary:#f7f6f3;--color-accent:#534ab7;--color-text-primary:#1a1a18;--color-text-secondary:#6b6a65;--color-text-tertiary:#9c9a92;--color-border:rgba(0,0,0,0.1);--color-border-tertiary:rgba(0,0,0,0.04);--nav-height:56px;--color-text-inverse:#ffffff;--color-accent-hover:#4439a0;--fs-xs:clamp(0.7rem,0.65rem + 0.25vw,0.8rem);--fs-sm:clamp(0.8rem,0.75rem + 0.25vw,0.9rem);--fs-base:clamp(0.9rem,0.85rem + 0.25vw,1rem);--fs-md:clamp(1rem,0.9rem + 0.5vw,1.25rem);--fs-lg:clamp(1.15rem,1rem + 0.75vw,1.5rem);--fs-xl:clamp(1.4rem,1.1rem + 1.5vw,2rem);--fs-2xl:clamp(1.75rem,1.3rem + 2.25vw,2.75rem);--fs-hero:clamp(2.5rem,1.5rem + 5vw,4.5rem);--font-sans:'Inter',system-ui,sans-serif;--lh-tight:1.1;--lh-snug:1.25;--lh-relaxed:1.75;--fw-medium:500;--fw-semibold:600;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;--space-2xs:4px;--space-xs:8px;--space-sm:12px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;--space-3xl:64px;--space-4xl:96px;--transition:150ms ease;--shadow-md:0 4px 12px rgba(0,0,0,0.08);--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--grain-opacity:0.03;--max-width:1200px}
    body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:var(--grain-opacity);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px 256px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.5;color:var(--color-text-primary);background:var(--color-bg);-webkit-font-smoothing:antialiased}
    .skip-link{position:absolute;top:-100%;left:var(--space-md);z-index:10000;background:var(--color-accent);color:var(--color-text-inverse);padding:var(--space-xs) var(--space-md);border-radius:var(--radius-sm);font-size:var(--fs-sm);font-weight:var(--fw-medium)}.skip-link:focus{top:var(--space-md)}
    .site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-height);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-lg);background:color-mix(in srgb, var(--color-bg) 85%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:0.5px solid var(--color-border-tertiary)}
    .site-nav__logo{display:flex;align-items:center;gap:var(--space-xs);font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-text-primary);text-decoration:none}.site-nav__logo:hover{color:var(--color-accent)}
    .site-nav__logo-icon{font-size:var(--fs-md);color:var(--color-accent)}
    .site-nav__amp{color:var(--color-accent);font-style:italic}
    .site-nav__links{display:flex;align-items:center;gap:var(--space-xs)}
    .site-nav__link{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--color-text-secondary);text-decoration:none;padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-sm);transition:color var(--transition),background var(--transition)}.site-nav__link:hover{color:var(--color-text-primary);background:var(--color-bg-secondary)}
    .site-nav__theme{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);color:var(--color-text-secondary);margin-left:var(--space-xs);cursor:pointer;background:none;border:none}.site-nav__theme:hover{color:var(--color-text-primary);background:var(--color-bg-secondary)}
    .icon--sun{display:none}.icon--moon{display:block}html.dark .icon--sun{display:block}html.dark .icon--moon{display:none}
    .container{max-width:var(--max-width);margin:0 auto;padding:0 var(--space-lg)}
    .page-main{padding-top:calc(var(--nav-height) + var(--space-2xl));padding-bottom:var(--space-3xl)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs);font-family:var(--font-sans);font-size:var(--fs-sm);font-weight:var(--fw-medium);padding:10px 20px;border-radius:var(--radius-md);border:0.5px solid var(--color-border);cursor:pointer;text-decoration:none;transition:all var(--transition);line-height:1;white-space:nowrap}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}.btn:active{transform:translateY(0)}
    .btn--primary{background:var(--color-accent);color:var(--color-text-inverse);border-color:var(--color-accent)}.btn--primary:hover{background:var(--color-accent-hover);border-color:var(--color-accent-hover)}
    .btn--secondary{background:var(--color-bg);color:var(--color-text-primary);border-color:var(--color-border)}.btn--secondary:hover{background:var(--color-bg-secondary)}
    .fade-in{opacity:0;transform:translateY(16px);transition:opacity 300ms ease,transform 300ms ease}.fade-in.visible{opacity:1;transform:translateY(0)}
    section{padding:var(--space-3xl) 0}
    .section-header{margin-bottom:var(--space-xl)}.section-header__eyebrow{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:var(--space-xs)}.section-header__title{font-size:var(--fs-xl);font-weight:var(--fw-semibold);color:var(--color-text-primary);letter-spacing:-0.02em}.section-header__desc{font-size:var(--fs-sm);color:var(--color-text-secondary);margin-top:var(--space-xs)}

    /* Blog page specific */
    .blog-header{text-align:center;padding:var(--space-3xl) 0 var(--space-2xl)}.blog-header__eyebrow{font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:var(--space-xs)}.blog-header__title{font-size:var(--fs-2xl);letter-spacing:-0.03em;line-height:var(--lh-tight);margin-bottom:var(--space-sm)}.blog-header__desc{font-size:var(--fs-md);color:var(--color-text-secondary);max-width:55ch;margin:0 auto}

    .post-list{list-style:none;display:flex;flex-direction:column;gap:var(--space-lg)}
    .post-card{display:block;padding:var(--space-lg);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-lg);text-decoration:none;color:inherit;transition:border-color var(--transition),transform var(--transition),box-shadow var(--transition)}.post-card:hover{border-color:var(--color-border);transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .post-card__meta{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-xs);flex-wrap:wrap}
    .post-card__date{font-size:var(--fs-xs);color:var(--color-text-tertiary);font-variant-numeric:tabular-nums}
    .post-card__reading-time{font-size:var(--fs-xs);color:var(--color-text-tertiary)}
    .post-card__title{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--color-text-primary);line-height:var(--lh-snug);margin-bottom:var(--space-2xs)}
    .post-card__desc{font-size:var(--fs-sm);color:var(--color-text-secondary);line-height:1.6;margin-bottom:var(--space-sm)}
    .post-card__tags{display:flex;flex-wrap:wrap;gap:var(--space-2xs)}
    .pill{display:inline-block;font-size:var(--fs-xs);font-weight:var(--fw-medium);padding:2px 10px;border-radius:var(--radius-full);background:var(--color-bg-secondary);color:var(--color-text-tertiary);text-decoration:none;transition:color var(--transition),background var(--transition)}.pill:hover{color:var(--color-text-primary);background:var(--color-border)}
    .pill--til{background:var(--color-accent);color:var(--color-text-inverse);opacity:0.85}

    .til-section{border-top:1px solid var(--color-border-tertiary);padding-top:var(--space-3xl)}
    .til-feed{list-style:none;display:flex;flex-direction:column;gap:var(--space-md)}
    .til-item{display:flex;gap:var(--space-md);align-items:flex-start;padding:var(--space-md) var(--space-lg);border-left:3px solid var(--color-accent);background:var(--color-bg-secondary);border-radius:0 var(--radius-md) var(--radius-md) 0;transition:background var(--transition)}
    .til-item:hover{background:var(--color-border-tertiary)}
    .til-item__content{flex:1}
    .til-item__title{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-text-primary);margin-bottom:var(--space-2xs)}
    .til-item__title a{color:inherit;text-decoration:none}.til-item__title a:hover{color:var(--color-accent)}
    .til-item__desc{font-size:var(--fs-xs);color:var(--color-text-secondary);line-height:1.5;margin-bottom:var(--space-2xs)}
    .til-item__meta{display:flex;gap:var(--space-sm);align-items:center}
    .til-item__date{font-size:var(--fs-xs);color:var(--color-text-tertiary);font-variant-numeric:tabular-nums}

    @media(max-width:768px){.site-nav__links{display:none}.site-nav__links.open{display:flex;position:fixed;top:var(--nav-height);left:0;right:0;bottom:0;background:var(--color-bg);flex-direction:column;align-items:center;justify-content:center;gap:var(--space-md);z-index:999}.site-nav__link{font-size:var(--fs-lg)}}
    .fade-in{opacity:1;transform:none}
    @media(prefers-color-scheme:dark){:root{--color-bg:#111110;--color-bg-secondary:#1a1a18;--color-text-primary:#e8e6de;--color-text-secondary:#a3a198;--color-text-tertiary:#6b6a63;--color-border:rgba(255,255,255,0.1);--color-border-tertiary:rgba(255,255,255,0.04);--color-accent:#7f77dd;--color-accent-hover:#948de8;--color-text-inverse:#1a1a18}}
  </style>

  <!-- Non-critical CSS loaded async -->
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/dark-mode.css">
  <link rel="stylesheet" href="/src/css/animations.css" media="print" onload="this.media='all'">
  <link rel="noscript" href="/src/css/animations.css">
</head>
<body>
  <!-- Skip link -->
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Nav (injected by JS) -->
  <div id="nav-container"></div>

  <!-- Main content -->
  <main id="main-content" class="page-main">
    <div class="container">

      <!-- Blog Header -->
      <header class="blog-header fade-in">
        <p class="blog-header__eyebrow">Writing</p>
        <h1 class="blog-header__title">Process Blog</h1>
        <p class="blog-header__desc">Case studies, TIL posts, and technical thinking.</p>
      </header>

      <!-- Case Studies -->
      <section class="fade-in" aria-label="Case studies">
        <header class="section-header">
          <h2 class="section-header__title">Case Studies</h2>
        </header>
        <ul class="post-list" id="case-studies-list" aria-label="Case study posts">
          <!-- Populated from /src/data/blog-posts.json -->
        </ul>
      </section>

      <!-- TIL Feed -->
      <section class="til-section fade-in" aria-label="TIL feed">
        <header class="section-header">
          <h2 class="section-header__title">TIL Feed</h2>
          <p class="section-header__desc">Today I Learned — short, focused insights.</p>
        </header>
        <ul class="til-feed" id="til-feed-list" aria-label="TIL posts">
          <!-- Populated from /src/data/blog-posts.json where tags include "TIL" -->
        </ul>
      </section>

    </div>
  </main>

  <!-- Footer (injected by JS) -->
  <div id="footer-container"></div>

  <!-- JavaScript -->
  <script src="/src/js/main.js" defer></script>
  <script defer>
    (function () {
      'use strict';

      function escapeHtml(str) {
        if (typeof str !== 'string') return str;
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function formatDate(dateStr) {
        var d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      async function loadBlogPosts() {
        try {
          var res = await fetch('/src/data/blog-posts.json');
          var posts = await res.json();

          // Sort by date descending
          posts.sort(function (a, b) {
            return new Date(b.date) - new Date(a.date);
          });

          // Case studies: posts without "TIL" tag
          var caseStudies = posts.filter(function (p) {
            return p.tags.indexOf('TIL') === -1;
          });

          // TIL feed: posts with "TIL" tag
          var tilPosts = posts.filter(function (p) {
            return p.tags.indexOf('TIL') !== -1;
          });

          // Render case studies
          var caseStudiesList = document.getElementById('case-studies-list');
          if (caseStudiesList) {
            caseStudiesList.innerHTML = caseStudies.map(function (post) {
              var tags = post.tags.map(function (t) {
                return '<span class="pill">' + escapeHtml(t) + '</span>';
              }).join('');
              return (
                '<li>' +
                  '<a href="' + escapeHtml(post.url) + '" class="post-card">' +
                    '<div class="post-card__meta">' +
                      '<time class="post-card__date" datetime="' + escapeHtml(post.date) + '">' + formatDate(post.date) + '</time>' +
                      '<span class="post-card__reading-time">' + escapeHtml(post.reading_time) + '</span>' +
                    '</div>' +
                    '<h3 class="post-card__title">' + escapeHtml(post.title) + '</h3>' +
                    '<p class="post-card__desc">' + escapeHtml(post.description) + '</p>' +
                    '<div class="post-card__tags">' + tags + '</div>' +
                  '</a>' +
                '</li>'
              );
            }).join('');
          }

          // Render TIL feed
          var tilFeedList = document.getElementById('til-feed-list');
          if (tilFeedList) {
            tilFeedList.innerHTML = tilPosts.map(function (post) {
              var tags = post.tags.map(function (t) {
                if (t === 'TIL') {
                  return '<span class="pill pill--til">' + escapeHtml(t) + '</span>';
                }
                return '<span class="pill">' + escapeHtml(t) + '</span>';
              }).join('');
              return (
                '<li class="til-item">' +
                  '<div class="til-item__content">' +
                    '<h3 class="til-item__title"><a href="' + escapeHtml(post.url) + '">' + escapeHtml(post.title) + '</a></h3>' +
                    '<p class="til-item__desc">' + escapeHtml(post.description) + '</p>' +
                    '<div class="til-item__meta">' +
                      '<time class="til-item__date" datetime="' + escapeHtml(post.date) + '">' + formatDate(post.date) + '</time>' +
                      '<span>' + escapeHtml(post.reading_time) + '</span>' +
                      '<div class="post-card__tags">' + tags + '</div>' +
                    '</div>' +
                  '</div>' +
                '</li>'
              );
            }).join('');
          }
        } catch (err) {
          console.warn('Failed to load blog posts:', err);
        }
      }

      document.addEventListener('DOMContentLoaded', loadBlogPosts);
    })();
  </script>
</body>
</html>
