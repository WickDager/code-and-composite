<!-- Command Palette Modal — injected into body by JS -->
<div class="cmd-palette-overlay" id="cmd-overlay" role="dialog" aria-modal="true" aria-label="Command palette" style="display:none">
  <div class="cmd-palette">
    <div class="cmd-palette__input-wrap">
      <svg class="cmd-palette__search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input class="cmd-palette__input" id="cmd-input" type="text" placeholder="Search projects, jump to sections…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search projects">
      <kbd class="cmd-palette__kbd">ESC</kbd>
    </div>
    <div class="cmd-palette__results" id="cmd-results" role="listbox"></div>
    <div class="cmd-palette__footer">
      <span><kbd>↑↓</kbd> Navigate</span>
      <span><kbd>↵</kbd> Open</span>
      <span><kbd>ESC</kbd> Close</span>
    </div>
  </div>
</div>
