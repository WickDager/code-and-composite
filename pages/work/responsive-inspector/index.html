<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive Layout Inspector — preview any URL at mobile, tablet, and desktop breakpoints.">
  <meta name="theme-color" content="#534AB7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formspree.io; frame-ancestors 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta property="og:title" content="Responsive Layout Inspector — Code &amp; Composite">
  <meta property="og:description" content="Drag a width slider to preview any URL at mobile/tablet/desktop. Shows active breakpoints.">
  <meta property="og:image" content="/public/images/og/og-responsive-inspector.jpg">
  <meta property="og:type" content="website">
  <title>Responsive Layout Inspector — Code &amp; Composite</title>
  <link rel="icon" href="/public/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/animations.css">
  <link rel="stylesheet" href="/src/css/dark-mode.css">
  <script src="/src/js/main.js" defer></script>
  <script src="/src/js/projects/responsive-inspector.js" defer></script>
  <style>
    .ri-controls { display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; margin-bottom: var(--space-lg); }
    .ri-url-input { flex: 1; min-width: 200px; font-family: var(--font-mono); font-size: var(--fs-sm); padding: 8px var(--space-sm); background: var(--color-bg-secondary); border: 0.5px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); }
    .ri-slider-wrap { margin-bottom: var(--space-lg); }
    .ri-slider { width: 100%; }
    .ri-meta { display: flex; justify-content: space-between; margin-bottom: var(--space-sm); font-size: var(--fs-xs); color: var(--color-text-tertiary); }
    .ri-viewport { display: flex; justify-content: center; background: var(--color-bg-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--radius-lg); padding: var(--space-lg); min-height: 500px; overflow: auto; }
    .ri-viewport__frame { width: 320px; min-height: 480px; background: #fff; border: 2px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; transition: width var(--transition-slow); }
    .ri-viewport__frame iframe { width: 100%; height: 480px; border: none; }
    .ri-breakpoint-badge { display: inline-block; font-size: 10px; font-weight: var(--fw-medium); padding: 2px 10px; border-radius: var(--radius-full); background: var(--color-accent); color: var(--color-text-inverse); }
    @media (max-width: 768px) { .ri-controls { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="nav-container"></div>
  <main id="main-content" class="page-main">
    <div class="container">
      <section class="fade-in" aria-label="Responsive Layout Inspector">
        <header class="section-header">
          <p class="section-header__eyebrow">Project</p>
          <h2 class="section-header__title">Responsive Layout Inspector</h2>
          <p class="section-header__desc">Drag a width slider to preview any URL at mobile, tablet, and desktop. Shows active breakpoints visually.</p>
        </header>

        <div class="ri-controls">
          <input class="ri-url-input" id="ri-url" type="url" placeholder="Enter a URL to preview (e.g. https://example.com)" value="https://example.com" aria-label="URL to preview">
          <button class="btn btn--primary btn--sm" id="ri-go" type="button">Load</button>
        </div>

        <div class="ri-slider-wrap">
          <div class="ri-meta">
            <span>320px</span>
            <span><span class="ri-breakpoint-badge" id="ri-label">Mobile</span></span>
            <span id="ri-width">320px</span>
            <span>1200px</span>
          </div>
          <input class="ri-slider" id="ri-slider" type="range" min="320" max="1200" value="320" aria-label="Viewport width slider">
        </div>

        <div class="ri-viewport">
          <div class="ri-viewport__frame" id="ri-preview">
            <iframe id="ri-iframe" src="https://example.com" title="Responsive preview frame" sandbox="allow-scripts allow-same-origin"></iframe>
          </div>
        </div>

        <div style="text-align:center;margin-top:var(--space-xl)">
          <a href="/pages/work/" class="btn btn--ghost">← Back to all projects</a>
        </div>
      </section>
    </div>
  </main>
  <div id="footer-container"></div>
</body>
</html>
